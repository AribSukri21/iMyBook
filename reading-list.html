
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self';
               img-src 'self' https://covers.openlibrary.org data:;">

    <title>iMyBook - My Reading List</title>
    <link rel="stylesheet" href="style.css">
    <script src="reading-list.js" defer></script>
</head>

<body>

    <!-- Application Header -->
    <header>
        <h1>iMyBook</h1>
        <p>Simple Reading Book Application</p>
    </header>

    <!-- Navigation Menu -->
    <nav>
        <a href="index.html">Discover Books</a>
        <a href="reading-list.html" class="active">My Reading List</a>
    </nav>

    <main>

        <!-- Add or Edit Book Form -->
        <section>
            <h2>Manage Reading List</h2>
            <p>Add a book manually or edit an existing record.</p>

            <form id="bookForm">

                <input type="hidden" id="editId">

                <label for="bookTitle">Book Title</label>
                <input type="text" id="bookTitle" required>

                <label for="bookAuthor">Author</label>
                <input type="text" id="bookAuthor" required>

                <label for="totalPages">Total Pages</label>
                <input type="number" id="totalPages"
                       min="1" step="1" required>

                <label for="pagesRead">Pages Read</label>
                <input type="number" id="pagesRead"
                       min="0" step="1" value="0" required>

                <label for="bookStatus">Reading Status</label>
                <select id="bookStatus">
                    <option value="Want to Read">Want to Read</option>
                    <option value="Reading">Reading</option>
                    <option value="Completed">Completed</option>
                </select>

                <div class="form-row">
                    <button type="submit" id="saveBtn">
                        Save Book
                    </button>

                    <button type="button" id="cancelBtn"
                            class="secondary">
                        Clear Form
                    </button>
                </div>
            </form>

            <p id="formMessage" class="message" role="status"></p>
        </section>

        <!-- Reading Calculator -->
        <section>
            <h2>Reading Progress Calculator</h2>
            <p>Calculate your reading progress and estimated
               remaining reading time.</p>

            <label for="readingSpeed">Reading Speed (pages per hour)</label>
            <input type="number" id="readingSpeed"
                   value="20" min="1" step="1">

            <button id="calculateBtn">Calculate Progress</button>

            <div id="calculationResult"></div>
        </section>

        <!-- Saved Book Records -->
        <section>
            <h2>My Saved Books</h2>
            <p id="bookCount"></p>

            <div id="savedBooks"></div>
        </section>

    </main>

    <footer>
        <p>iMyBook | CSC2923 Final Project</p>
    </footer>

</body>
</html>
